<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efe4d0">
  <title>观战 · 九宫棋</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    try {
      var t = localStorage.getItem("ninegrid-theme");
      if (t === "cosmos" || t === "classic") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) { /* 隐私模式下忽略 */ }
  </script>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="glow glow-a"></span>
    <span class="glow glow-b"></span>
    <span class="grain"></span>
  </div>

  <main class="page">
    <header class="masthead">
      <div class="title-row">
        <h1>观战</h1>
        <span class="seal" aria-hidden="true">观<br>棋</span>
        <span class="member-badge" aria-hidden="true">MEMBER</span>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">
          <span class="theme-opt" data-theme-opt="classic" aria-pressed="true">古典</span>
          <span class="theme-opt" data-theme-opt="cosmos" aria-pressed="false">✦ 星穹会员</span>
        </button>
      </div>
      <p class="sub">把房间码递进来，实时看这一盘棋怎么下。<br>只读旁观，不影响对局。</p>
      <nav class="top-nav">
        <a href="/">回去下棋</a>
      </nav>
    </header>

    <section id="watch-lobby" class="panel">
      <form id="watch-form" class="join">
        <input id="watch-code-input" maxlength="6" placeholder="六位房间码" autocomplete="off"
               spellcheck="false" inputmode="latin">
        <button type="submit" class="ghost">观战</button>
      </form>
      <p class="hint">也可以把对局链接里的 <code>?room=CODE</code> 换到这里。</p>
    </section>

    <section id="watch-game" class="panel hidden">
      <div class="room">
        <div>
          <span class="label">房间码</span>
          <strong id="watch-room-code">------</strong>
        </div>
        <span id="watch-conn" class="conn-badge" role="status" aria-live="polite">连接中…</span>
      </div>

      <div class="seats">
        <div class="seat" id="watch-seat-o">
          <span class="mark o"></span>
          <div><b>O 方</b><small id="watch-seat-o-name">—</small></div>
        </div>
        <div class="seat" id="watch-seat-x">
          <span class="mark x"></span>
          <div><b>X 方</b><small id="watch-seat-x-name">—</small></div>
        </div>
      </div>

      <p class="status" id="watch-status" role="status" aria-live="polite">正在载入…</p>

      <div class="stage" id="watch-stage">
        <div class="board" id="watch-board" role="group" aria-label="九宫棋盘（观战，只读）"></div>
      </div>

      <details class="moves" open>
        <summary>棋谱 <span id="watch-ply-count">0</span> 手</summary>
        <ol id="watch-move-list"></ol>
      </details>

      <button id="watch-leave-btn" class="ghost small" type="button">退出观战</button>
    </section>
  </main>
  <script src="/theme.js"></script>
  <script src="/watch.js" defer></script>
</body>
</html>
