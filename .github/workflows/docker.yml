name: docker

# 只做一件事：证明 `Dockerfile` 还能构建出镜像。
#
# 为什么单独一个 workflow：镜像构建要拉基础镜像、编 release + fat LTO，比 CI 里
# 其它 job 慢一个数量级；但完全不构建它，Dockerfile 就会在没人注意的时候烂掉
# （这轮就踩到过基础镜像拉不下来、缓存写法自欺欺人两个坑）。
#
# 因此：只在 main 上、且只在这些路径变化时跑；PR 不跑，避免每次提交都等镜像。
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "migrations/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: docker build（不推送镜像）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # 只构建不推送：这个 job 担保的是「能构建」，不是「已发布」。
      # 真要发镜像，另加一个带 registry 登录的 job，别把两件事混在一起。
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha,scope=nine-grid-image
          cache-to: type=gha,mode=max,scope=nine-grid-image

      - name: compose 配置能解析
        run: docker compose config --quiet
