[workspace]
resolver = "2"
members = ["crates/bot", "crates/core", "crates/server"]
exclude = ["chain"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
nine-grid-bot = { path = "crates/bot" }
nine-grid-core = { path = "crates/core" }
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "tokio",
  "query",
] }
dotenvy = "0.15"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
