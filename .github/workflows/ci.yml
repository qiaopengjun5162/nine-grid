name: CI

# 触发条件与 rust-template / moonpub 一致：主分支推送 + 所有 PR。
# 单人仓库也值得跑 PR 检查 —— 它挡的是"手滑 push 到 main"。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一个分支连续推送时，取消上一轮还在跑的检查，省 runner 分钟
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt（rustfmt + taplo）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # taplo 用官方预编译产物，比 cargo install 快一个数量级。
      #
      # 但 GitHub 对匿名 release 下载会间歇性回 403（runner 出口 IP 共享），
      # 这跟代码质量无关，却会把 fmt 判红。所以退避重试，最后退到 cargo install：
      # 慢几分钟可以接受，因为「下载失败」不该等价于「格式不对」。
      - name: Install taplo
        run: |
          set -uo pipefail
          url="https://github.com/tamasfe/taplo/releases/download/0.9.3/taplo-linux-x86_64.gz"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --connect-timeout 10 --max-time 60 "$url" | gunzip -c > "$RUNNER_TEMP/taplo"; then
              chmod +x "$RUNNER_TEMP/taplo"
              echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "第 $attempt 次下载失败，退避重试"
            sleep $((attempt * 3))
          done
          echo "预编译包反复拿不到，退回 cargo install"
          cargo install taplo-cli --locked --version 0.9.3

      - name: taplo fmt --check
        run: taplo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - uses: taiki-e/install-action@nextest

      - name: cargo nextest
        run: cargo nextest run --all-features

  msrv:
    name: msrv（1.94）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cargo.toml 里写了 rust-version = "1.94"，这个 job 负责让那句话是真的。
      # --locked 也重要：检查我们实际发布的那套依赖，而不是让旧工具链重新解析一遍。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo check --locked
        run: cargo check --all-features --locked

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # 忽略项写在 .cargo/audit.toml 里，每条都带理由（未编译的 SQLite/MySQL 后端）
      - name: cargo audit
        run: cargo audit

  # 真正的端到端检查：起一个 Postgres，跑 migrations + 二进制 + 44 项冒烟。
  # 这一步才验证"服务能启动、能落库、能下完一局"，单元测试替代不了。
  e2e:
    name: e2e（Postgres + smoke）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nine_grid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nine_grid
      BIND_ADDR: 127.0.0.1:8080
      RUST_LOG: info,nine_grid_server=debug
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      - name: 安装冒烟脚本依赖
        run: sudo apt-get update && sudo apt-get install -y uuid-runtime jq

      - name: 编译服务端
        run: cargo build -p nine-grid-server

      - name: 启动服务并等它就绪
        run: |
          ./target/debug/nine-grid > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo "服务已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "服务 30 秒内没有就绪"
          cat /tmp/server.log
          exit 1

      - name: 跑冒烟测试
        run: bash scripts/smoke.sh http://127.0.0.1:8080

      - name: 失败时上传服务日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log
          path: /tmp/server.log
          if-no-files-found: ignore

  # 链上程序由 Solana SBF 工具链编译，其 rustc 固定为 1.89。
  # 这条 job 一箭双雕：既跑链上单测/格式/lint，又用同版本 rustc 当"MSRV 守卫"——
  # 一旦 core 的 rust-version 被改回 1.94（就像 2026-11 那次 sqlx 升级），
  # 这里会立刻报 "requires rustc 1.94"，不用等本地 anchor build 才发现。
  chain:
    name: chain（链上单测 + SBF 1.89 守卫）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chain
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: chain

      - name: 链上单测（含 19683 棋盘一致性）
        run: cargo test --locked

      - name: 链上 rustfmt
        run: cargo fmt --all -- --check

      - name: 链上 clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # 证明也会过期：core 改了判胜、Lean 侧没跟上，README 里那句"零 sorry、与 Rust 逐格一致"
  # 就成了空话。这条 job 钉两件事：lake build 里不许出现 sorry，以及 19683 个棋盘的判胜结果逐行相同。
  lean:
    name: lean（证明 + 与 Rust 逐格交叉验证）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 不跟 latest 漂：版本由 verification/lean/lean-toolchain 固定，elan 只负责把它装上。
      - name: 安装 elan
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: 缓存工具链与构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            verification/lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('verification/lean/lean-toolchain') }}-${{ hashFiles('verification/lean/**/*.lean') }}

      - uses: dtolnay/rust-toolchain@stable

      - name: 编译全部定理（出现 sorry 直接失败）
        working-directory: verification/lean
        run: |
          set -euo pipefail
          lake build 2>&1 | tee /tmp/lean-build.log
          # 证明里补了 sorry 时编译器只报警告，这里把它升级成失败
          if grep -q "declaration uses 'sorry'" /tmp/lean-build.log; then
            echo "::error::证明里出现了 sorry"
            exit 1
          fi
          if grep -q "sorryAx" /tmp/lean-build.log; then
            echo "::error::定理依赖了 sorryAx"
            exit 1
          fi

      - name: 与 Rust core 逐格比对 19683 个棋盘
        run: bash verification/lean/compare.sh
