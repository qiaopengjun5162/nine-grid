version: 2

updates:
  # Rust 依赖：每周一次，分两个组，避免一次开出十几个 PR
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 补丁与小版本合并成一个 PR
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies

  # Actions 本身也会过期（checkout v4 → v5 这种），单独一档
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - ci
